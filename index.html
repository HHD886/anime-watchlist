<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fc">
  <title>HHD 的追番表</title>
  <style>
    :root{--bg:#f5f6fa;--panel:rgba(255,255,255,.92);--solid:#fff;--soft:#fafafe;--text:#20232a;--muted:#747a88;--line:#e5e7ef;--accent:#6860f5;--accent-soft:#eeecff;--shadow:0 10px 30px rgba(30,36,50,.08);--radius:18px}
    body.dark{--bg:#111319;--panel:rgba(28,31,39,.94);--solid:#1c1f27;--soft:#171a21;--text:#f3f4f7;--muted:#a5aab5;--line:#313541;--accent:#918bff;--accent-soft:#2b2844;--shadow:0 12px 34px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at top right,rgba(104,96,245,.11),transparent 34%),var(--bg);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{width:min(1460px,100%);margin:auto;padding:22px}.topbar{position:sticky;top:12px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.brand h1{margin:0;font-size:clamp(22px,3vw,32px)}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);border-radius:12px;padding:9px 13px;color:var(--text);background:var(--solid)}.btn:hover{border-color:var(--accent)}.btn.icon{width:40px;padding-inline:0}.status{margin:11px 4px 0;color:var(--muted);font-size:12px}.status.error{color:#d34c4c}.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--solid)}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;margin-top:7px;font-size:25px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}.tabs{display:flex;flex:1;gap:7px;padding:5px;overflow-x:auto;border:1px solid var(--line);border-radius:15px;background:var(--solid)}.tab{border:0;border-radius:11px;padding:9px 14px;color:var(--muted);background:transparent;white-space:nowrap}.tab.active{color:#fff;background:var(--accent)}.search{width:min(300px,100%);padding:11px 13px;border:1px solid var(--line);border-radius:13px;outline:0;color:var(--text);background:var(--solid)}.view{display:none}.view.active{display:block}.section-head{margin:20px 2px 12px}.section-head h2{margin:0;font-size:21px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.vertical-stack{display:flex;flex-direction:column;gap:15px}.day-block,.group-block{border:1px solid var(--line);border-radius:var(--radius);background:var(--solid);padding:14px}.group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:11px;margin-bottom:12px;border-bottom:1px solid var(--line)}.group-name{display:flex;align-items:center;gap:9px;font-weight:800}.day-badge{display:inline-grid;place-items:center;min-width:58px;height:31px;padding:0 10px;border-radius:10px;color:var(--accent);background:var(--accent-soft);font-size:13px}.tier-badge{display:inline-grid;place-items:center;min-width:48px;height:31px;padding:0 10px;border-radius:10px;color:#fff;font-size:13px}.ssr{background:linear-gradient(135deg,#ff9c37,#ef4f9b)}.sr{background:linear-gradient(135deg,#7b61ff,#b65cff)}.r{background:linear-gradient(135deg,#4c8dff,#59b9ff)}.count-pill{padding:3px 8px;border-radius:999px;color:var(--muted);background:var(--bg);font-size:12px}.day-tier-stack{display:flex;flex-direction:column;gap:11px}.day-tier-block{padding:11px;border:1px solid var(--line);border-radius:15px;background:var(--soft)}.day-tier-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.day-tier-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px}.anime-card{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;min-width:0;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:15px;background:var(--soft);transition:.18s}.day-tier-block .anime-card{background:var(--solid)}.anime-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.cover{width:76px;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);border-radius:11px;background:linear-gradient(135deg,var(--accent-soft),var(--bg))}.cover.placeholder{display:grid;place-items:center;font-size:26px}.card-main{display:flex;min-width:0;flex-direction:column}.card-title{margin:1px 0 0;font-size:15px;line-height:1.45;writing-mode:horizontal-tb!important;word-break:normal;overflow-wrap:anywhere}.title-link{color:inherit;text-decoration:none}.title-link:hover{color:var(--accent);text-decoration:underline}.original-title,.meta{color:var(--muted);font-size:11px;line-height:1.45}.original-title{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note{margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-height:44px;overflow:hidden}.tag{padding:2px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--solid);font-size:10px}.progress-wrap{margin-top:auto;padding-top:8px}.progress-line{height:6px;overflow:hidden;border-radius:99px;background:var(--bg)}.progress-line i{display:block;height:100%;border-radius:inherit;background:var(--accent)}.progress-text{display:flex;justify-content:space-between;gap:8px;margin-top:4px;color:var(--muted);font-size:11px}.empty{grid-column:1/-1;padding:22px 12px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;font-size:13px}.footer{padding:30px 0 10px;color:var(--muted);text-align:center;font-size:12px}
    @media(max-width:900px){.topbar{position:static;align-items:flex-start}.overview{grid-template-columns:repeat(2,1fr)}.tabs{order:1;width:100%;flex-basis:100%}.search{flex:1;width:auto}.cards-grid{grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}}
    @media(max-width:600px){.app{padding:12px}.topbar{display:grid;padding:15px;border-radius:18px}.actions{justify-content:flex-start}.overview{gap:8px}.stat{padding:13px}.stat strong{font-size:21px}.day-block,.group-block{padding:11px}.cards-grid{grid-template-columns:1fr}.anime-card{grid-template-columns:66px minmax(0,1fr);min-height:108px}.cover{width:66px}.btn span{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><h1>HHD 的追番表</h1><p>手机只读版 · 数据由电脑发布到 GitHub Pages</p></div><div class="actions"><button class="btn" id="refreshBtn">⟳ <span>刷新数据</span></button><button class="btn icon" id="themeBtn" title="切换深色模式">◐</button></div></header>
  <div class="status" id="statusText">正在读取追番数据…</div>
  <section class="overview"><div class="stat"><span>正在追番</span><strong id="statDaily">0</strong></div><div class="stat"><span>完结待看</span><strong id="statBinge">0</strong></div><div class="stat"><span>漫画待看</span><strong id="statManga">0</strong></div><div class="stat"><span>小说待看</span><strong id="statNovel">0</strong></div></section>
  <div class="toolbar"><div class="tabs" id="tabs"><button class="tab active" data-view="daily">每日更新</button><button class="tab" data-view="binge">完结待看</button><button class="tab" data-view="manga">漫画待看</button><button class="tab" data-view="novel">小说待看</button></div><input class="search" id="searchInput" placeholder="搜索标题、标签或备注…"></div>
  <main>
    <section class="view active" id="view-daily"><div class="section-head"><h2>每日更新区</h2><p>周一到周日纵向排列；每天只显示实际存在的 SSR、SR、R。</p></div><div class="vertical-stack" id="dailyGrid"></div></section>
    <section class="view" id="view-binge"><div class="section-head"><h2>完结待看区</h2><p>SSR、SR、R 从上到下排列。</p></div><div class="vertical-stack" id="bingeGrid"></div></section>
    <section class="view" id="view-manga"><div class="section-head"><h2>漫画待看区</h2><p>按 SSR、SR、R 分类。</p></div><div class="vertical-stack" id="mangaGrid"></div></section>
    <section class="view" id="view-novel"><div class="section-head"><h2>小说待看区</h2><p>按 SSR、SR、R 分类。</p></div><div class="vertical-stack" id="novelGrid"></div></section>
  </main>
  <div class="footer">本页面为只读展示版。作品、分类和进度请在电脑编辑器中修改后重新发布。</div>
</div>
<script>
const weekdays=['周一','周二','周三','周四','周五','周六','周日'];
const tiers=['SSR','SR','R'];
const tierText={SSR:'最优先',SR:'比较想看',R:'有空再看'};
const fallbackPayload={"version":3,"publishedAt":"2026-07-31T16:48:00+08:00","items":[{"id":"27c9ccf3-1e57-44b9-8380-22472b70961a","title":"尼古喵喵","originalTitle":"ヤニねこ","type":"daily","subtype":"周四","weekday":"周四","priority":"SSR","current":0,"total":12,"image":"","tags":["TV","日本","漫画改","2026年7月","搞笑","日常","BiburyAnimationStudios","2026"],"sourceUrl":"https://bgm.tv/subject/622206","bangumiId":"622206","note":"Bangumi · 2026-07-02","importedAt":""},{"id":"19792781-f891-483c-8a3b-2204e3205b62","title":"女神“异世界转生想成为什么”我“勇者的肋骨”","originalTitle":"女神『異世界転生何になりたいですか』俺「勇者の肋骨で」","type":"binge","subtype":"SSR","weekday":"","priority":"SSR","current":0,"total":12,"image":"","tags":["TV","日本","小说改","搞笑","异世界","2026年4月","轻小说改","抽象"],"sourceUrl":"https://bgm.tv/subject/623854","bangumiId":"623854","note":"Bangumi · 2026-04-07","importedAt":""},{"id":"c458edc9-0910-4725-b533-6286023b1b87","title":"经理女孩悠悠日常","originalTitle":"マネマネにちにち","type":"manga","subtype":"SSR","weekday":"","priority":"SSR","current":0,"total":"","image":"","tags":["日本","漫画","校园","日常","原创","系列","连载中","山本崇一朗"],"sourceUrl":"https://bgm.tv/subject/498801","bangumiId":"498801","note":"Bangumi · 2025-03-12","importedAt":""},{"id":"8acf55da-6bd6-4345-a9b1-aba24b7a668c","title":"示例：待读小说","originalTitle":"","type":"novel","subtype":"R","weekday":"","priority":"R","current":2,"total":10,"image":"","tags":[],"sourceUrl":"","bangumiId":"","note":"记录读到第几卷","importedAt":""}]};
let items=[],searchText='',activeView='daily';
const $=id=>document.getElementById(id);
function esc(s=''){return String(s).replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]));}
function escAttr(s=''){return esc(s).replace(/`/g,'&#96;');}
function normalize(raw={}){const type=['daily','binge','manga','novel'].includes(raw.type)?raw.type:'binge';let weekday=weekdays.includes(raw.weekday)?raw.weekday:(type==='daily'?'周一':'');let priority=tiers.includes(raw.priority)?raw.priority:'R';let tags=Array.isArray(raw.tags)?raw.tags:[];return{id:String(raw.id||''),title:String(raw.title||'未命名作品'),originalTitle:String(raw.originalTitle||''),type,weekday,priority,current:Math.max(0,Number(raw.current||0)),total:raw.total===''||raw.total==null?'':Math.max(0,Number(raw.total||0)),image:String(raw.image||''),tags:tags.map(String),sourceUrl:String(raw.sourceUrl||''),bangumiId:String(raw.bangumiId||''),note:String(raw.note||'')}}
function matches(i){if(!searchText)return true;return `${i.title} ${i.originalTitle} ${i.tags.join(' ')} ${i.note}`.toLowerCase().includes(searchText.toLowerCase())}
function iconFor(t){return t==='manga'?'📖':t==='novel'?'📚':'🎬'}
function coverHTML(i){if(i.image)return `<img class="cover" src="${escAttr(i.image)}" alt="${escAttr(i.title)} 封面" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;cover placeholder&quot;>${iconFor(i.type)}</div>'">`;return `<div class="cover placeholder" data-cover-id="${escAttr(i.bangumiId)}">${iconFor(i.type)}</div>`}
function cardHTML(i){const current=Number(i.current||0),total=Number(i.total||0),pct=total>0?Math.max(0,Math.min(100,current/total*100)):0,unit=i.type==='manga'?'话':i.type==='novel'?'卷':'集';const title=i.sourceUrl?`<a class="title-link" href="${escAttr(i.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(i.title)}</a>`:esc(i.title);const tags=i.tags.slice(0,8).map(t=>`<span class="tag">${esc(t)}</span>`).join('');return `<article class="anime-card">${coverHTML(i)}<div class="card-main"><h3 class="card-title">${title}</h3>${i.originalTitle&&i.originalTitle!==i.title?`<div class="original-title">${esc(i.originalTitle)}</div>`:''}${tags?`<div class="tag-row">${tags}</div>`:''}<div class="meta note">${esc(i.note||'暂无备注')}</div><div class="progress-wrap"><div class="progress-line"><i style="width:${pct}%"></i></div><div class="progress-text"><span>${total>0?`${current} / ${total} ${unit}`:`${current} ${unit}`}</span><span>${total>0?Math.round(pct)+'%':'未设总数'}</span></div></div></div></article>`}
function dailyTierHTML(day,tier){const list=items.filter(i=>i.type==='daily'&&i.weekday===day&&i.priority===tier&&matches(i));if(!list.length)return'';return `<section class="day-tier-block"><div class="day-tier-head"><div class="day-tier-name"><span class="tier-badge ${tier.toLowerCase()}">${tier}</span><span>${tierText[tier]}</span></div><span class="count-pill">${list.length} 部</span></div><div class="cards-grid">${list.map(cardHTML).join('')}</div></section>`}
function dailyDayHTML(day){const list=items.filter(i=>i.type==='daily'&&i.weekday===day&&matches(i));const groups=tiers.map(t=>dailyTierHTML(day,t)).filter(Boolean).join('');return `<section class="day-block"><div class="group-head"><div class="group-name"><span class="day-badge">${day}</span><span>当日更新</span></div><span class="count-pill">${list.length} 部</span></div><div class="day-tier-stack">${groups||`<div class="empty">${day}暂时没有作品</div>`}</div></section>`}
function groupHTML(tier,list){return `<section class="group-block"><div class="group-head"><div class="group-name"><span class="tier-badge ${tier.toLowerCase()}">${tier}</span><span>${tierText[tier]}</span></div><span class="count-pill">${list.length} 部</span></div><div class="cards-grid">${list.length?list.map(cardHTML).join(''):'<div class="empty">这个优先级暂时没有作品</div>'}</div></section>`}
function render(){ $('statDaily').textContent=items.filter(i=>i.type==='daily').length;$('statBinge').textContent=items.filter(i=>i.type==='binge').length;$('statManga').textContent=items.filter(i=>i.type==='manga').length;$('statNovel').textContent=items.filter(i=>i.type==='novel').length;$('dailyGrid').innerHTML=weekdays.map(dailyDayHTML).join('');for(const [type,target] of [['binge','bingeGrid'],['manga','mangaGrid'],['novel','novelGrid']])$(target).innerHTML=tiers.map(t=>groupHTML(t,items.filter(i=>i.type===type&&i.priority===t&&matches(i)))).join('');hydrateMissingCovers();}
async function loadData(){const status=$('statusText');status.className='status';status.textContent='正在读取追番数据…';try{const r=await fetch(`./data.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const p=await r.json();const list=Array.isArray(p)?p:p.items;if(!Array.isArray(list))throw new Error('data.json 格式错误');items=list.map(normalize);render();const when=p.publishedAt?new Date(p.publishedAt).toLocaleString():'未知';status.textContent=`已载入 ${items.length} 部作品 · 最近发布：${when}`;}catch(e){items=(fallbackPayload.items||[]).map(normalize);render();status.className='status error';status.textContent=`读取 data.json 失败，当前显示内置备用数据：${e.message}`;}}
async function hydrateMissingCovers(){const cache=JSON.parse(localStorage.getItem('watchlistCoverCache_v1')||'{}');const targets=[...document.querySelectorAll('[data-cover-id]')];for(const el of targets){const id=el.dataset.coverId;if(!id)continue;try{let url=cache[id];if(!url){const r=await fetch(`https://api.bgm.tv/v0/subjects/${encodeURIComponent(id)}`);if(!r.ok)continue;const s=await r.json();url=s.images?.large||s.images?.common||s.images?.medium||'';if(url){if(url.startsWith('//'))url='https:'+url;cache[id]=url;localStorage.setItem('watchlistCoverCache_v1',JSON.stringify(cache));}}if(url&&el.isConnected){const img=document.createElement('img');img.className='cover';img.src=url;img.alt='作品封面';img.referrerPolicy='no-referrer';img.onerror=()=>{};el.replaceWith(img);}}catch{}}}
function setView(v){activeView=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===`view-${v}`))}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)setView(b.dataset.view)});$('searchInput').addEventListener('input',e=>{searchText=e.target.value.trim();render()});$('refreshBtn').addEventListener('click',loadData);function applyTheme(t){document.body.classList.toggle('dark',t==='dark');localStorage.setItem('watchlistViewerTheme_v1',t)}$('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('dark')?'light':'dark'));applyTheme(localStorage.getItem('watchlistViewerTheme_v1')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));loadData();
</script>
</body>
</html>
